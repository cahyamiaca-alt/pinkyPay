<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="115" fill="url(#pinkGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="105" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4"/>

  <!-- Decorative Background Circles -->
  <circle cx="420" cy="90" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="90" cy="420" r="70" fill="rgba(255,255,255,0.08)"/>

  <!-- Main Wallet Body -->
  <rect x="106" y="166" width="300" height="200" rx="32" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Wallet Flap / Pocket -->
  <path d="M106 206 C 106 186, 122 170, 142 170 L 370 170 C 390 170, 406 186, 406 206 L 406 246 C 406 266, 390 282, 370 282 L 142 282 C 122 282, 106 266, 106 246 Z" fill="#fdf2f8"/>
  
  <!-- Flap Divider Line -->
  <line x1="106" y1="256" x2="406" y2="256" stroke="#fbcfe8" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Wallet Clasp with Gold Coin Accent -->
  <rect x="316" y="236" width="75" height="55" rx="16" fill="url(#pinkGrad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="353" cy="263" r="12" fill="url(#goldGrad)"/>

  <!-- Sparkles Top Right -->
  <path d="M390 100 L400 125 L425 135 L400 145 L390 170 L380 145 L355 135 L380 125 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M130 115 L136 130 L151 136 L136 142 L130 157 L124 142 L109 136 L124 130 Z" fill="#ffffff" opacity="0.8"/>

  <!-- Currency Ribbon / Heart Icon -->
  <path d="M256 312 C246 298, 226 298, 216 312 C206 326, 226 346, 256 366 C286 346, 306 326, 296 312 C286 298, 266 298, 256 312 Z" fill="#ec4899"/>
  
  <!-- App Title Bottom -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="1">PinkyPay</text>
</svg>